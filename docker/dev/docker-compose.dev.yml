version: '3.8'

services:
  postgres:
    image: postgres:14-alpine
    container_name: cuppa_postgres_dev
    environment:
      POSTGRES_DB: cuppa_db
      POSTGRES_USER: cuppa_user
      POSTGRES_PASSWORD: cuppa_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql

  redis-backend:
    image: redis:7-alpine
    container_name: cuppa_redis_backend
    ports:
      - "6379:6379"
    volumes:
      - redis_backend_data:/data

  redis-frontend:
    image: redis:7-alpine
    container_name: cuppa_redis_frontend
    ports:
      - "6380:6379"  # 🆕 Другой порт для фронтенда
    volumes:
      - redis_frontend_data:/data

volumes:
  postgres_data:
  redis_backend_data:
  redis_frontend_data:  # 🆕
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cuppa App API Documentation</title>

    <link rel="stylesheet" type="text/css" href="https://unpkg.com/swagger-ui-dist/swagger-ui.css"/>

    <link rel="stylesheet" type="text/css" href="/css/custom-swagger-style.css">

    <style>
        .loading {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background: #2a2732;
            color: #d1c9e0;
            font-family: 'Roboto', sans-serif;
            font-size: 18px;
        }

        .error {
            display: none;
            padding: 20px;
            background: #47444d;
            color: #d1c9e0;
            border-radius: 8px;
            margin: 20px;
            border-left: 4px solid #f44336;
        }

        html, body {
            margin: 0;
            padding: 0;
            height: 100%;
            width: 100%;
            background: #0f0d15;
        }

        #swagger-ui {
            display: none;
        }
    </style>
</head>
<body>
<div class="loading" id="loading">
    Loading API Documentation...
</div>

<div class="error" id="error">
    <h3>Error Loading Documentation</h3>
    <p>Could not load API documentation. Please check:</p>
    <ul>
        <li>Spring Boot application is running</li>
        <li>API docs endpoint is available at <code>/v3/api-docs</code></li>
        <li>Check browser console for errors</li>
    </ul>
</div>

<div id="swagger-ui" style="display: none;"></div>

<script src="https://unpkg.com/swagger-ui-dist/swagger-ui-bundle.js"></script>
<script src="https://unpkg.com/swagger-ui-dist/swagger-ui-standalone-preset.js"></script>

<script src="/js/custom-swagger-script.js"></script>

<script>
    function checkApiAvailability() {
        return fetch('/v3/api-docs')
            .then(response => {
                if (!response.ok) {
                    throw new Error('API not available');
                }
                return response.json();
            });
    }

    function initSwagger() {
        try {
            const ui = SwaggerUIBundle({
                url: '/v3/api-docs',
                dom_id: '#swagger-ui',
                deepLinking: true,
                presets: [
                    SwaggerUIBundle.presets.apis,
                    SwaggerUIBundle.presets.standalone  // ВАЖНО: добавляем standalone!
                ],
                plugins: [
                    SwaggerUIBundle.plugins.DownloadUrl
                ],
                layout: "BaseLayout",
                requestInterceptor: (request) => {
                    console.log('Request:', request);
                    return request;
                },
                responseInterceptor: (response) => {
                    console.log('Response:', response);
                    return response;
                }
            });

            window.ui = ui;

            document.getElementById('loading').style.display = 'none';
            document.getElementById('swagger-ui').style.display = 'block';

        } catch (error) {
            console.error('Swagger initialization error:', error);
            showError('Failed to initialize Swagger UI: ' + error.message);
        }
    }

    function showError(message) {
        document.getElementById('loading').style.display = 'none';
        document.getElementById('error').style.display = 'block';
        console.error('Swagger Error:', message);
    }

    document.addEventListener('DOMContentLoaded', function() {
        console.log('Checking API availability...');

        checkApiAvailability()
            .then(apiDoc => {
                console.log('API docs loaded successfully:', apiDoc);
                initSwagger();
            })
            .catch(error => {
                console.error('API not available:', error);
                showError('API documentation is not available. Make sure the Spring Boot application is running.');
            });
    });

    // Fallback timeout
    setTimeout(() => {
        if (document.getElementById('loading').style.display !== 'none') {
            showError('Loading timeout. Please refresh the page.');
        }
    }, 10000);
</script>

<script>
    function updateSwaggerText() {
        const title = document.querySelector('.swagger-ui .info .title');
        const desc = document.querySelector('.swagger-ui .info .description');

        if (title) {
            title.textContent = 'CUPPA CHAT API';
            title.style.cssText = `
                font-family: 'Orbitron', monospace !important;
                text-shadow: 0 0 30px rgba(204, 204, 255, 0.7) !important;
                animation: titleGlow 3s ease-in-out infinite alternate !important;
            `;
        }

        if (desc) {
            desc.innerHTML = `
                <div class="neon-description">
                    <div class="neon-main">Real-time messaging API | Spring Boot 3 | WebSocket</div>

                    <div class="neon-team">
                        <span class="neon-label">Development Team:</span><br>

                        <a href="https://t.me/Sudeeneess" target="_blank" class="neon-link">
                            <span class="neon-tag">@Sudeeneess</span>
                        </a>

                        <span class="neon-separator">•</span>

                        <a href="https://t.me/ggkamchek" target="_blank" class="neon-link">
                            <span class="neon-tag">@ggkamchek</span>
                        </a>

                        <span class="neon-separator">•</span>

                        <a href="https://t.me/WaffleMuffin" target="_blank" class="neon-link">
                            <span class="neon-tag">@WaffleMuffin</span>
                        </a>
                    </div>

                    <div class="neon-version">
                        <span class="neon-label">Version:</span>
                        <span class="neon-value">1.0.0</span>
                    </div>
                </div>
            `;
        }
    }

    const neonStyles = document.createElement('style');
    neonStyles.textContent = `
        .neon-description {
            text-align: center;
            font-family: 'Inter', sans-serif;
            line-height: 1.6;
        }

        .neon-main {
            color: #ccccff;
            font-size: 20px;
            font-weight: 600;
            margin-bottom: 20px;
            text-shadow: 0 0 15px rgba(204, 204, 255, 0.6);
            animation: textPulse 4s ease-in-out infinite alternate;
        }

        .neon-team {
            color: #b8b8ff;
            font-size: 16px;
            margin-bottom: 15px;
        }

        .neon-label {
            color: #ffffff;
            font-weight: 600;
        }

        .neon-link {
            text-decoration: none;
            transition: all 0.3s ease;
        }

        .neon-tag {
            color: #ccccff;
            text-shadow: 0 0 8px rgba(204, 204, 255, 0.5);
            margin: 0 5px;
            padding: 2px 8px;
            border-radius: 6px;
            transition: all 0.3s ease;
            display: inline-block;
        }

        .neon-link:hover .neon-tag {
            background: rgba(204, 204, 255, 0.2);
            text-shadow: 0 0 15px rgba(204, 204, 255, 0.8);
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(204, 204, 255, 0.3);
        }

        .neon-separator {
            color: #9999ff;
            margin: 0 3px;
        }

        .neon-version {
            color: #9999ff;
            font-size: 14px;
            font-weight: 500;
        }

        .neon-value {
            color: #ccccff;
            text-shadow: 0 0 8px rgba(204, 204, 255, 0.4);
        }

        @keyframes textPulse {
            0% { text-shadow: 0 0 10px rgba(204, 204, 255, 0.4); }
            100% { text-shadow: 0 0 20px rgba(204, 204, 255, 0.8); }
        }

        @keyframes titleGlow {
            from { text-shadow: 0 0 30px rgba(204, 204, 255, 0.5); }
            to { text-shadow: 0 0 40px rgba(204, 204, 255, 0.8); }
        }
    `;
    document.head.appendChild(neonStyles);

    document.addEventListener('DOMContentLoaded', function() {
        [500, 1000, 1500, 2000, 3000].forEach(delay => {
            setTimeout(updateSwaggerText, delay);
        });
        setInterval(updateSwaggerText, 2000);
    });
</script>
</body>
</html>

spring.application.name=CuppaApp

# Database Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/cuppa_db
spring.datasource.username=cuppa_user
spring.datasource.password=cuppa_pass
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA Configuration
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
# Отключить security для разработки (временно)
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.SecurityAutoConfiguration

# Или настроить свою security конфигурацию
spring.security.user.name=admin
spring.security.user.password=admin
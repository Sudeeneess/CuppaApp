spring.application.name=CuppaApp
server.port=9000
# Database Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/cuppa_db
spring.datasource.username=cuppa_user
spring.datasource.password=cuppa_pass
spring.datasource.driver-class-name=org.postgresql.Driver
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql

# Flyway migration
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.validate-on-migrate=true
spring.flyway.database-type=postgresql
# ????????? ????????
spring.flyway.validate-migration-naming=true
# ???????????? - ?? ???????????? ? ??????????!
spring.flyway.clean-disabled=true

# JPA Configuration
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true


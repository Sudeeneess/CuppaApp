# ===============================
# APPLICATION BASIC CONFIGURATION
# ===============================
spring.application.name=CuppaApp
server.port=8080
server.servlet.context-path=/

# ===============================
# DATABASE CONFIGURATION
# ===============================
spring.datasource.url=jdbc:postgresql://localhost:5432/cuppa_db
spring.datasource.username=cuppa_user
spring.datasource.password=cuppa_pass
spring.datasource.driver-class-name=org.postgresql.Driver
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql

# ===============================
# JPA & HIBERNATE CONFIGURATION
# ===============================
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# ===============================
# JWT SECURITY CONFIGURATION
# ===============================
app.jwt.secret=kXp2s5v8y/B?E(H+MbQeThWmZq4t6w9z$C&F)J@NcRfUjXn2r5u8x/A%D*G-KaPdSgVkYp3s6v9y$B&E)H+MbQeThWmZq4t7w!z%C*F?
app.jwt.expiration=86400000

# ===============================
# SECURITY & CORS CONFIGURATION
# ===============================
# CORS Allowed Origins
app.security.cors.allowed-origins=http://localhost:3000,http://localhost:5173,http://localhost:8080,http://localhost:8081,http://127.0.0.1:3000,http://127.0.0.1:5173,https://cuppaapp.onrender.com

# Security Headers
app.security.headers.content-security-policy=default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self'; connect-src 'self' ws: wss:

# Rate Limiting Configuration
app.security.rate-limit.max-requests-per-minute=100
app.security.rate-limit.max-requests-per-hour=1000
app.security.rate-limit.login-max-attempts=5
app.security.rate-limit.login-block-duration-minutes=15

# Message Security Limits
app.security.message.max-text-length=10000
app.security.message.max-file-size-kb=500
app.security.message.max-image-size-kb=500
app.security.message.search-query-max-length=100

# ===============================
# WEB SOCKET CONFIGURATION
# ===============================
app.websocket.endpoint=/ws-chat
app.websocket.broker.prefix=/topic
app.websocket.application.prefix=/app
app.websocket.user.destination-prefix=/user

# ===============================
# ANOMALY DETECTION CONFIGURATION
# ===============================
app.security.anomaly.suspicious-actions-threshold=10
app.security.anomaly.failed-login-threshold=5
app.security.anomaly.access-denied-threshold=8
app.security.anomaly.cleanup-interval-hours=24

# ===============================
# LOGGING CONFIGURATION
# ===============================
logging.level.com.cuppa.CuppaApp=INFO
logging.level.org.springframework.security=DEBUG
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# Security-specific logging
logging.level.com.cuppa.CuppaApp.security=DEBUG
logging.level.com.cuppa.CuppaApp.service.AnomalyDetectionService=INFO

# Log file configuration
logging.file.name=logs/cuppa-app.log
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} - %logger{36} - %msg%n

# ===============================
# ACTUATOR & MONITORING
# ===============================
management.endpoints.web.exposure.include=health,metrics,info,prometheus
management.endpoints.web.base-path=/actuator
management.endpoints.enabled-by-default=true
management.endpoint.health.show-components=always
management.endpoint.metrics.enabled=true
management.endpoint.info.enabled=true
management.info.env.enabled=true

# Custom metrics
management.metrics.export.prometheus.enabled=true
management.metrics.enable.all=true

# Health check details
management.endpoint.health.show-details=always
management.health.db.enabled=true
management.health.diskspace.enabled=true

# ===============================
# STATIC CONTENT & MVC
# ===============================
spring.web.resources.static-locations=classpath:/static/
spring.mvc.static-path-pattern=/**
spring.data.web.pageable.serialization-mode=via_dto

# Cache settings for static resources
spring.web.resources.cache.period=3600
spring.web.resources.chain.strategy.content.enabled=true
spring.web.resources.chain.strategy.content.paths=/**

# ===============================
# PERFORMANCE & OPTIMIZATION
# ===============================
server.tomcat.max-threads=200
server.tomcat.min-spare-threads=10
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Connection pool settings
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.max-lifetime=1200000

# ===============================
# DEVELOPMENT & DEBUGGING
# ===============================
# Exclude auto-configuration for manual security setup
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.SecurityAutoConfiguration,org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration

# Debug mode (disable in production)
debug=false
spring.output.ansi.enabled=ALWAYS

